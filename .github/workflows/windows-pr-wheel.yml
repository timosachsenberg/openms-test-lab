name: Windows PR wheel lab
run-name: OpenMS PR ${{ inputs.pr_number }} · Python ${{ inputs.python_version }}

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: OpenMS/OpenMS pull request number
        required: true
        default: '10146'
        type: string
      run_id:
        description: Upstream wheel run ID (blank selects latest successful run for current PR head)
        default: ''
        type: string
      python_version:
        description: Python version (64-bit)
        default: '3.12'
        required: true
        type: string
      expected_curl:
        description: Required bundled libcurl version (blank skips version assertion)
        default: '8.12.1'
        type: string
      debug:
        description: Open SSH after testing, including on failure
        default: false
        type: boolean
      session_minutes:
        description: Maximum SSH session duration
        default: '60'
        type: choice
        options: ['15', '30', '60', '120']

permissions:
  contents: read
  actions: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 150
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
      LAB_PR_NUMBER: ${{ inputs.pr_number }}
      LAB_UPSTREAM_RUN: ${{ inputs.run_id }}
      LAB_EXPECTED_CURL: ${{ inputs.expected_curl }}
      LAB_SESSION_MINUTES: ${{ inputs.session_minutes }}
      LAB_EXTRA_PACKAGES: pefile
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ inputs.python_version }}
          architecture: x64
      - name: Download and verify PR wheel
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/Get-PRWheel.ps1
      - name: Install exact PR wheel and dependencies
        run: ./scripts/Initialize-Python.ps1
      - name: Test stubs and bundled DLLs with minimal PATH
        run: ./.venv/Scripts/python.exe scripts/verify-pr-wheel.py
      - name: Package smoke test
        if: ${{ !cancelled() }}
        run: ./scripts/Test-Python.ps1
      - name: Collect diagnostics
        if: ${{ !cancelled() }}
        run: ./scripts/Collect-Diagnostics.ps1
      - name: Download reports before debugging
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-wheel-reports-${{ github.run_id }}
          path: reports/
          retention-days: 7
      - name: SSH debugging session
        if: ${{ !cancelled() && inputs.debug }}
        timeout-minutes: 125
        run: ./scripts/Start-SSH.ps1
      - name: Download tested wheel and exports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-wheel-exports-${{ github.run_id }}
          path: exports/
          retention-days: 7
          if-no-files-found: warn
