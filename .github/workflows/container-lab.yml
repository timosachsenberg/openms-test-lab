name: Container lab
run-name: Container lab · ${{ inputs.image }} · ${{ inputs.runner }}

# C10 of RELEASE-READINESS.md: a published OpenMS container image, checked like an installed
# package. The images are built by OpenMS' containerdeploy.yml, separately from the
# installers, and are what workflow systems such as bigbio/quantms run.

on:
  workflow_dispatch:
    inputs:
      image:
        description: Image to check; a tag (latest is the nightly, <version> a release) or a digest
        default: ghcr.io/openms/openms-tools-thirdparty:latest
        type: string
      runner:
        description: Runner, and with it the image's platform
        type: choice
        default: ubuntu-24.04
        options: ['ubuntu-24.04', 'ubuntu-24.04-arm']
      topp_test_selection:
        description: Upstream TOPP tests to run in the image; all, release-gate, or a regex
        default: all
        type: string

permissions:
  contents: read

jobs:
  container:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      LAB_CONTAINER_IMAGE: ${{ inputs.image }}
      LAB_TOPP_TEST_SELECTION: ${{ inputs.topp_test_selection }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: C10 · check the image like an installed package
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/container-checks.py
      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-lab-reports-${{ github.run_id }}
          path: reports/
          retention-days: 14
