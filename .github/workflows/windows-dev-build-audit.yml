name: Windows development build and DLL audit
run-name: OpenMS development package · ${{ inputs.openms_commit }}

on:
  workflow_dispatch:
    inputs:
      openms_commit:
        description: Exact OpenMS/OpenMS commit SHA to build (40 hexadecimal characters)
        required: true
        default: 'dc3083a7961e17c4d7ecc929de68494f6eec5a6f'
        type: string

permissions:
  contents: read
  actions: read

env:
  LAB_OPENMS_COMMIT: ${{ inputs.openms_commit }}
  PYTHONUTF8: '1'
  QT_QPA_PLATFORM: offscreen

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Validate the requested commit
        run: |
          if ($env:LAB_OPENMS_COMMIT -notmatch '^[0-9a-fA-F]{40}$') { throw 'Provide a full commit SHA.' }
      - name: Check out the exact OpenMS source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: OpenMS/OpenMS
          ref: ${{ inputs.openms_commit }}
          persist-credentials: false
      - name: Check out lab helpers
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: _lab
          persist-credentials: false
      - name: Verify source identity
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:LAB_OPENMS_COMMIT) { throw 'Source commit mismatch.' }
      - name: Build and test using the upstream Windows CI recipe
        id: upstream
        uses: ./.github/actions/build
        with:
          compiler: cl.exe
      - name: Create the development installer
        env:
          LAB_CMAKE_PRESET: ${{ steps.upstream.outputs.preset }}
        run: ./_lab/scripts/Build-DevPackage.ps1
      - name: Upload the installer and its provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openms-dev-installer-${{ inputs.openms_commit }}
          path: _lab/exports/dev-package/
          retention-days: 14
          if-no-files-found: error
      - name: Upload build diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openms-dev-build-reports-${{ github.run_id }}
          path: |
            _lab/reports/
            build/windows-x64-ci/Testing/Temporary/LastTest.log
          retention-days: 14
          if-no-files-found: warn

  audit:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Inventory runtimes on the separate audit runner
        run: ./scripts/Runtime-Baseline.ps1 -Phase before
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install the audit tool
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m venv .venv
          ./.venv/Scripts/python.exe -m pip install pefile==2024.8.26
      - name: Download the development installer from this build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: openms-dev-installer-${{ inputs.openms_commit }}
          path: downloads/dev-package
      - name: Verify and install the development package
        run: ./scripts/Install-DevPackage.ps1
      - name: Inventory runtimes after installation
        if: ${{ !cancelled() }}
        run: ./scripts/Runtime-Baseline.ps1 -Phase after
      - name: Audit packaged libraries and actual native DLL loads
        run: ./.venv/Scripts/python.exe scripts/dll-audit.py --phase audit --native-only
      - name: Upload development DLL audit reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openms-dev-dll-audit-${{ github.run_id }}
          path: reports/
          retention-days: 14
          if-no-files-found: error
